name: ed25519_edwards
description: Ed25519 signature implementation for Dart, ported from Go cryptography and compatible with RFC 8032 keys.
version: 0.3.2
homepage: https://github.com/Tougee/ed25519

environment:
  sdk: '>=2.12.0 <4.0.0'

dependencies:
  collection: ^1.15.0
  crypto: ^3.0.0
  convert: ^3.0.0
  adaptive_number: ^1.0.0
dev_dependencies:
  lints: ^1.0.1
  test: ^1.16.4
  hex: ^0.2.0
  benchmark_harness: ^2.0.0
